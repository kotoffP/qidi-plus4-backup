# 6. Допустимое отклонение от номинала (в мм), при котором еще работает автоподстройка
#Max_diameter_percentage: 10


# ДЛЯ ІНФОРМАЦІЇ: Додаємо кнопку-макрос під датчиком
[gcode_macro CHECK_FILAMENT]
gcode:
    QUERY_FILAMENT_WIDTH

# 1. Створюємо макрос, який буде зберігати в собі товщину нитки як змінну
[gcode_macro FILAMENT_MONITOR]
description: Показує живий діаметр нитки прямо з датчика в консоль
gcode:
    # Зчитуємо актуальне значення безпосередньо в момент натискання кнопки
    {% set live_dia = printer.hall_filament_width_sensor.Diameter|float %}
    
    # Виводимо його в консоль (з округленням до 2 знаків)
    { action_respond_info("Поточний діаметр нитки: %.2f мм" % live_dia) }

[gcode_macro PID_CALIBRATE_HOTEND]
description: Калібрування PID хотенду з вибором температури та автозбереженням
gcode:
    # Зчитуємо параметр TARGET, якщо його немає — беремо 250 за замовчуванням
    {% set target_temp = params.TARGET | default(250) | int %}
    
    M117 Запуск PID ({target_temp}C)...
    {action_respond_info("Вмикання обдуву моделі на 50%...")}
    M106 S128                             # Вмикаємо кулер моделі на 50%
    
    {action_respond_info("Старт PID екструдера на %d°C. Зачекайте..." % target_temp)}
    PID_CALIBRATE HEATER=extruder TARGET={target_temp}
    
    # Запускаємо таймер відкладеного автозбереження
    UPDATE_DELAYED_GCODE ID=AUTO_SAVE_PID_CHUNKS DURATION=5

[delayed_gcode AUTO_SAVE_PID_CHUNKS]
gcode:
    # Якщо калібрування ще триває, перевіряємо знову через 5 секунд
    {% if printer.extruder.target > 0 and printer.idle_timeout.state == "Printing" %}
        UPDATE_DELAYED_GCODE ID=AUTO_SAVE_PID_CHUNKS DURATION=5
    {% else %}
        # Якщо тест завершився:
        M106 S0                           # Вимикаємо вентилятор
        M117 PID завершено. Збереження...
        {action_respond_info("PID успішно відкалібровано! Зберігаю конфігурацію та перезавантажую принтер...")}
        G4 P2000                          # Пауза 2 секунди
        SAVE_CONFIG                       # Автоматичне збереження та перезапуск
    {% endif %}


[gcode_macro PID_CALIBRATE_BED]
description: Калібрування PID столу з вибором температури та автозбереженням
gcode:
    # Зчитуємо параметр TARGET, якщо його немає — беремо 60 за замовчуванням
    {% set target_temp = params.TARGET | default(60) | int %}
    
    M117 Запуск PID столу ({target_temp}C)...
    {action_respond_info("Старт PID нагрівального столу на %d°C. Зачекайте..." % target_temp)}
    PID_CALIBRATE HEATER=heater_bed TARGET={target_temp}
    
    # Запускаємо таймер відкладеного автозбереження для столу
    UPDATE_DELAYED_GCODE ID=AUTO_SAVE_PID_BED DURATION=5

[delayed_gcode AUTO_SAVE_PID_BED]
gcode:
    # Якщо калібрування триває, перевіряємо знову через 5 секунд
    {% if printer.heater_bed.target > 0 and printer.idle_timeout.state == "Printing" %}
        UPDATE_DELAYED_GCODE ID=AUTO_SAVE_PID_BED DURATION=5
    {% else %}
        # Якщо тест столу повністю завершився:
        M117 PID столу завершено. Збереження...
        {action_respond_info("PID столу успішно відкалібровано! Зберігаю конфігурацію та перезавантажую принтер...")}
        G4 P2000                          # Пауза 2 секунди
        SAVE_CONFIG                       # Автоматичне збереження та перезапуск
    {% endif %}

[gcode_macro PREPARE_NOZZLE_CHANGE]
description: Підготовка до заміни сопла з автовимкненням через 15 хвилин простою
gcode:
    M117 Позиціювання голови...
    {action_respond_info("Введення осей у вихідне положення (Home)...")}
    
    # Виконуємо повний Home
    G28
    
    # Додаємо команду очікування завершення попередніх дій у черзі
    M400 
    
    G90                                   # Абсолютні координати
    {action_respond_info("Підйом голови у зручну позицію для заміни сопла...")}
    G1 X150 Y150 Z150 F6000                # Тепер рух виконається лише ПІСЛЯ завершення G28
    
    # Решта коду макросу (нагрів та таймери) залишається без змін...
    M117 Нагрів хотенду до 250C...
    M104 S250
    M109 S250
    M117 ГОТОВО! Міняйте сопло
    {action_respond_info("Хотенд нагріто до 250°C. ОБЕРЕЖНО, ГАРАЧО! Запущено таймер безпеки на 15 хвилин.")}
    UPDATE_DELAYED_GCODE ID=NOZZLE_TIMEOUT DURATION=900


[delayed_gcode NOZZLE_TIMEOUT]
gcode:
    # Перевіряємо, чи хотенд досі гарячий (чи користувач не вимкнув його сам)
    {% if printer.extruder.target > 0 %}
        M104 S0                           # Вимикаємо нагрів хотенду
        M117 Таймер вийшов! Нагрів вимкнено.
        {action_respond_info("УВАГА: Минуло 15 хвилин. Нагрів хотенду автоматично вимкнено з міркувань безпеки!")}
        # Сигнал тривоги біпером
        M300 P800 S500
    {% endif %}

[maintain]
interval: 60  # Сюди обов'язково треба додати цей рядок!

[gcode_macro CANCEL_NOZZLE_TIMEOUT]
description: Скинути таймер безпеки (якщо ви вже замінили сопло і друкуєте/охолоджуєте далі)
gcode:
    UPDATE_DELAYED_GCODE ID=NOZZLE_TIMEOUT DURATION=0
    {action_respond_info("Таймер автовимкнення хотенду скасовано.")}

[firmware_retraction]
retract_length: 0.5
#   Довжина відкату в мм (стартуємо з 0.5 для Conch M6)
retract_speed: 35
#   Швидкість відкату в мм/с
unretract_extra_length: 0.0
#   Додаткова подача після повернення (зазвичай 0)
unretract_speed: 30
#   Швидкість повернення пластику в мм/с


#[include K-ShakeTune/*.cfg]
[shaketune]
#timeout: 1200

#    The maximum time in seconds to let Shake&Tune process the CSV files and generate the graphs.
# result_folder: ~/printer_data/config/ShakeTune_results
#    The folder where the results will be stored. It will be created if it doesn't exist.
# number_of_results_to_keep: 3
#    The number of results to keep in the result_folder. The oldest results will
#    be automatically deleted after each runs.
# keep_raw_csv: False
#    If True, the raw CSV files will be kept in the result_folder alongside the
#    PNG graphs. If False, they will be deleted and only the graphs will be kept.
# show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for "system" macros that are not in the
#    printer.cfg file. If you want to see the macros in the webui, set this to True.

[gcode_macro COMPARE_BELTS_RESPONSES]
description: Тестування та порівняння натягу ременів CoreXY
gcode:
    # Очищаємо старі файли перед тестом, щоб не було каші
    RUN_SHELL_COMMAND CMD=shaketune_clear_tmp
    
    RESPOND MSG="Запуск тестування ременя А (напрямок 1)..."
    TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data NAME=belt_a
    
    RESPOND MSG="Запуск тестування ременя В (напрямок 2)..."
    TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data NAME=belt_b
    
    RESPOND MSG="Обробка результатів та генерація графіків..."
    RUN_SHELL_COMMAND CMD=shaketune_generate_belts

[gcode_shell_command shaketune_clear_tmp]
command: rm -f /tmp/raw_data_*.csv /tmp/resonances_*.csv
timeout: 5.0

[gcode_shell_command shaketune_generate_belts]
command: bash -c "/home/mks/klippy-env/bin/python /home/mks/klipper/scripts/graph_accelerometer.py /tmp/raw_data_axis*.csv -o /home/mks/printer_data/config/ShakeTune_results/belts_compare.png && rm -f /tmp/raw_data_axis*.csv"
timeout: 300.0
verbose: True

[gcode_macro AXES_SHAPER_CALIBRATION]
description: Калібрування Input Shaper для осей X та Y з генерацією графіків
gcode:
    # Попереднє очищення старих файлів у /tmp
    RUN_SHELL_COMMAND CMD=shaketune_clear_tmp
    
    RESPOND MSG="Вимірювання резонансів по осі X..."
    SHAPER_CALIBRATE AXIS=X
    
    RESPOND MSG="Вимірювання резонансів по осі Y..."
    SHAPER_CALIBRATE AXIS=Y
    
    RESPOND MSG="Генерація графіків рекомендацій для шейперів..."
    RUN_SHELL_COMMAND CMD=shaketune_generate_shaper

[gcode_shell_command shaketune_generate_shaper]
command: bash -c "/home/mks/klippy-env/bin/python /home/mks/klipper/scripts/calibrate_shaper.py /tmp/calibration_data_x_*.csv -o /home/mks/printer_data/config/ShakeTune_results/shaper_calibrate_x.png && /home/mks/klippy-env/bin/python /home/mks/klipper/scripts/calibrate_shaper.py /tmp/calibration_data_y_*.csv -o /home/mks/printer_data/config/ShakeTune_results/shaper_calibrate_y.png && rm -f /tmp/calibration_data_*.csv"
timeout: 300.0
verbose: True

[delayed_gcode check_chamber_temp]
initial_duration: 1.0
gcode:
  # Зчитуємо температуру саме з вашого датчика захисту камери
  {% set current_temp = printer["temperature_sensor Chamber_Thermal_Protection_Sensor"].temperature %}
  
  {% if current_temp > 45.7 %}
    # Виводимо текст на екран принтера та у консоль Fluidd
    M117 WARNING: Chamber Overheat (>45C)!
    # Подаємо звуковий сигнал (частота 1000 Гц, тривалість 500 мс)
    M300 S1000 P500 
  {% endif %}
  
  # Повторюємо перевірку кожну 1 секунду
  UPDATE_DELAYED_GCODE ID=check_chamber_temp DURATION=1.0


[gcode_macro AUTO_CLEAN_PETG_WITH_PA]
description: Прочистка хотенду за допомогою поліаміду (PA)
gcode:
    # Оптимальні параметри для висмикування Нейлону, забитого липким PETG
    {% set HOT_TEMP = params.HOT_TEMP|default(260)|int %}   # Температура для повного змішування PA та залишків PETG
    {% set COLD_TEMP = params.COLD_TEMP|default(180)|int %} # Температура "напіврезини" для Нейлону (почніть з 140°C)
    
    M117 Heating to 260C...
    G90                                 # Абсолютні координати
    G28                                 # Хомінг (якщо принтер не захомлений)
    G1 Z120 F1500                       # Піднімаємо голову для зручного доступу
    G1 X140 Y140 F6000                  # Зсуваємо голову в центр
    
    # 1. Розігрів для повного розплавлення PETG
    M104 S{HOT_TEMP}
    M109 S{HOT_TEMP}
    
    # 2. Продавлювання Нейлону (витісняємо рідкий PETG)
    M117 Pushing PA Nylon...
    G91                                 # Відносні координати
    M83                                 # Відносна екструзія
    #G1 E35 F120                         # Повільно проштовхуємо 35 мм нейлону
    G1 E85 F120                        # Проталкиваем 85 мм нейлона (длится 60 секунд)
    
    # Пауза перед охлаждением (пластик успевает выйти из сопла и снять напряжение)
    M117 Holding temperature...
    G4 P2000                           # Пауза 10 000 миллисекунд (10 секунд)

    # 3. Охолодження до точки кристалізації PA
    M117 Cooling to pull temp...
    M104 S{COLD_TEMP}
    M109 S{COLD_TEMP}                   # Чекаємо стабілізації на 140°C
    
    # 4. Швидкий автоматичний ретракт мотором QIDI
    M117 Pulling out plug!
    G1 E-95 F3600                       # Максимально різкий ривок на 95 мм вгору (швидкість 60 мм/с)
    
    # 5. Завершення процедури
    M400                                # Чекаємо завершення руху
    M104 S0                             # Вимикаємо нагрів сопла
    M117 Pull done! Pull out filament.
    G90                                 # Повертаємо абсолютний режим

#ТО
[gcode_macro SHOW_MAINTENANCE_STATUS]
description: Показати залишок годин до ТО на екрані принтера (збережені дані)
gcode:
    # Зчитуємо змінні безпосередньо з файлу збереження Qidi
    {% set sv = printer.save_variables.variables %}
    
    # Витягуємо значення (якщо якогось немає, беремо дефолт)
    {% set rails = sv.to_rails_remaining | default(100.0) | float %}
    {% set nozzle = sv.to_clean_nozzle_remaining | default(50.0) | float %}
    {% set hotend = sv.to_hotend_remaining | default(300.0) | float %}
    {% set axis_z = sv.to_axis_z_remaining | default(150.0) | float %}
    {% set filter = sv.to_filter_remaining | default(300.0) | float %}

    # Вивід на екран принтера Qidi (латиницею)
    M117 Rails:{rails|int}h | Z:{axis_z|int}h | Hotend:{hotend|int}h
    
    # Повний звіт для консолі Fluidd / Mainsail
    {action_respond_info("=== ЗАЛИШОК ЧАСУ ДО ТО (ГОДИН) ===")}
    {action_respond_info("Змащення напрямних: %.1f год" % rails)}
    {action_respond_info("Очищення сопла: %.1f год" % nozzle)}
    {action_respond_info("Обслуговування хотенду: %.1f год" % hotend)}
    {action_respond_info("Змащення осі Z: %.1f год" % axis_z)}
    {action_respond_info("Заміна фільтра: %.1f год" % filter)}


# --- МАКРОСИ АВТОМАТИЧНОГО ОБНУЛЕННЯ (КНОПКИ) ---

